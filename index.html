<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informační systémy a databáze — Interaktivní kurz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a56db;--blue-h:#1d4ed8;--blue-50:#eff6ff;--blue-100:#dbeafe;--blue-200:#bfdbfe;--blue-dark:#1e40af;--blue-text:#042c53;
  --bg:#f0f4ff;--white:#fff;--text:#111827;--sec:#6b7280;--hint:#9ca3af;
  --border:#dbeafe;--border2:#bfdbfe;
  --green-bg:#f0fdf4;--green-b:#bbf7d0;--green-t:#14532d;--green-m:#16a34a;
  --amber-bg:#fffbeb;--amber-b:#fde68a;--amber-t:#78350f;--amber-m:#d97706;
  --red-bg:#fef2f2;--red-b:#fecaca;--red-t:#991b1b;--red-m:#dc2626;
  --purple-bg:#faf5ff;--purple-t:#5b21b6;
  --r:8px;--rl:12px;--rxl:14px;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:1.5rem 1rem}
.page{max-width:740px;margin:0 auto}

/* HEADER */
.hdr{background:var(--blue);border-radius:var(--rxl);padding:1.25rem 1.5rem;margin-bottom:1rem;display:flex;align-items:center;gap:14px}
.hdr-icon{width:42px;height:42px;background:rgba(255,255,255,.15);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hdr-icon svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hdr h1{font-size:16px;font-weight:600;color:#fff;margin-bottom:2px}
.hdr p{font-size:12px;color:rgba(255,255,255,.7)}

/* PROGRESS */
.prog{background:var(--white);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1rem;border:1px solid var(--border)}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-lbl{font-size:11px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.06em}
.prog-pct{font-size:12px;font-weight:600;color:var(--blue)}
.prog-track{height:6px;background:var(--blue-100);border-radius:3px;overflow:hidden;margin-bottom:10px}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--blue),#3b82f6);border-radius:3px;transition:width .5s ease}
.snav{display:flex;gap:5px;flex-wrap:wrap}
.sb{padding:4px 10px;font-size:11px;font-weight:500;border-radius:20px;border:1px solid var(--border);background:var(--white);color:var(--sec);cursor:pointer;transition:all .15s;font-family:inherit;white-space:nowrap}
.sb:hover:not([disabled]){background:var(--blue-50);color:var(--blue-dark)}
.sb.done{background:var(--blue-50);color:var(--blue-dark);border-color:var(--blue-200)}
.sb.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.sb[disabled]{opacity:.35;cursor:default}

/* LESSON CARD */
.lcard{background:var(--white);border-radius:var(--rxl);overflow:hidden;border:1px solid var(--border);margin-bottom:1rem;box-shadow:0 1px 3px rgba(26,86,219,.06)}
.lhead{padding:1.25rem 1.5rem 1rem;border-bottom:1px solid var(--blue-50)}
.lbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:.625rem}
.lbadge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.b-intro{background:var(--blue-50);color:var(--blue-dark)}
.b-sim{background:var(--green-bg);color:#166534}
.b-deep{background:var(--purple-bg);color:var(--purple-t)}
.b-eth{background:var(--amber-bg);color:#92400e}
.b-prot{background:var(--blue-50);color:var(--blue-dark)}
.b-addr{background:var(--green-bg);color:#166534}
.b-wifi{background:var(--purple-bg);color:var(--purple-t)}
.b-inet{background:var(--red-bg);color:#9f1239}
.b-quiz{background:#fdf4ff;color:#6b21a8}
.ltitle{font-size:19px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3}
.lsub{font-size:13px;color:var(--sec)}
.lbody{padding:1.25rem 1.5rem}

/* CONTENT */
.txt{font-size:14px;line-height:1.75;margin-bottom:1rem;color:var(--text)}
.txt p{margin-bottom:.75rem}.txt p:last-child{margin:0}
.txt strong{font-weight:600}

.hl{border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem;font-size:13px;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.hl-icon{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.hl strong{font-weight:600}
.hl-blue{background:var(--blue-50);color:var(--blue-text);border:1px solid var(--blue-200)}
.hl-green{background:var(--green-bg);color:var(--green-t);border:1px solid var(--green-b)}
.hl-amber{background:var(--amber-bg);color:var(--amber-t);border:1px solid var(--amber-b)}
.hl-red{background:var(--red-bg);color:var(--red-t);border:1px solid var(--red-b)}

.def-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-bottom:1rem}
.def-card{background:var(--blue-50);border:1px solid var(--border);border-radius:var(--r);padding:.75rem}
.def-term{font-size:10px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.def-val{font-size:13px;line-height:1.5;color:var(--text)}

.info-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:1rem;border-radius:var(--r);overflow:hidden}
.info-table th{background:var(--blue-50);padding:8px 12px;text-align:left;font-weight:600;font-size:12px;color:var(--blue-dark);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
.info-table td{padding:8px 12px;border-bottom:1px solid var(--blue-50);color:var(--text)}
.info-table tr:last-child td{border-bottom:none}
.info-table tr:nth-child(even) td{background:var(--blue-50)}
.info-table.tight td,.info-table.tight th{padding:5px 9px;font-size:12px}

/* CANVAS */
.cvs-wrap{border-radius:var(--rl);overflow:hidden;border:1px solid var(--border);background:var(--blue-50);margin-bottom:1rem}
.cvs-wrap canvas{width:100%;display:block}
.cvs-hint{font-size:11px;color:var(--hint);text-align:center;padding:5px 0 7px}

/* CONTROLS */
.status-bar{font-size:13px;color:var(--sec);padding:.5rem 1rem;background:var(--blue-50);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem;min-height:38px;line-height:1.5}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:.75rem}
.btn{padding:8px 16px;font-size:13px;font-weight:500;border-radius:var(--r);cursor:pointer;transition:all .15s;font-family:inherit}
.btn-p{background:var(--blue);color:#fff;border:none}.btn-p:hover{background:var(--blue-h)}.btn-p:disabled{opacity:.4;cursor:default}
.btn-d{background:#fff;color:var(--red-m);border:1px solid var(--red-b)}.btn-d:hover{background:var(--red-bg)}
.btn-ok{background:#fff;color:var(--green-m);border:1px solid var(--green-b)}.btn-ok:hover{background:var(--green-bg)}
.btn-g{background:#fff;color:var(--text);border:1px solid var(--border2)}.btn-g:hover{background:var(--blue-50)}.btn-g:disabled{opacity:.35;cursor:default}

.log-box{font-size:11px;font-family:monospace;max-height:88px;overflow-y:auto;padding:6px 10px;background:var(--blue-50);border:1px solid var(--border);border-radius:var(--r);margin-bottom:.75rem}
.lg{padding:1.5px 0;border-bottom:1px solid var(--border)}.lg:last-child{border:none}
.lg.ok{color:var(--green-m)}.lg.err{color:var(--red-m)}.lg.info{color:var(--blue)}.lg.warn{color:var(--amber-m)}

/* STEP PILLS */
.spills{display:flex;gap:4px;margin-bottom:.875rem}
.sp{width:28px;height:4px;border-radius:2px;background:var(--blue-100);transition:background .3s}
.sp.done{background:var(--blue-200)}.sp.on{background:var(--blue)}
.expl-card{border:1px solid var(--border);border-radius:var(--rl);padding:.875rem 1rem;margin-bottom:.875rem;background:var(--blue-50)}
.expl-num{font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
.expl-title{font-size:14px;font-weight:600;margin-bottom:5px;color:var(--text)}
.expl-desc{font-size:13px;line-height:1.6;color:var(--sec)}
.expl-nav{display:flex;gap:8px;margin-bottom:1rem}

/* PILLS / TABS */
.topo-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.875rem}
.topo-pill{padding:5px 14px;font-size:12px;font-weight:500;border-radius:20px;border:1px solid var(--border2);background:#fff;cursor:pointer;font-family:inherit;color:var(--sec);transition:all .15s}
.topo-pill.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.topo-pill:hover:not(.on){background:var(--blue-50);color:var(--blue-dark)}

/* QUIZ */
.q-prog-wrap{height:4px;background:var(--blue-100);border-radius:2px;margin-bottom:1.25rem;overflow:hidden}
.q-prog{height:100%;background:var(--blue);border-radius:2px;transition:width .3s}
.q-meta{font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.q-text{font-size:15px;font-weight:600;line-height:1.5;margin-bottom:1rem;color:var(--text)}
.q-opts{display:flex;flex-direction:column;gap:7px;margin-bottom:.875rem}
.q-opt{padding:10px 14px;border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;font-size:13px;font-family:inherit;background:#fff;color:var(--text);text-align:left;transition:all .1s;line-height:1.4}
.q-opt:hover:not([disabled]){background:var(--blue-50);border-color:var(--blue-200)}
.q-opt.correct{background:var(--green-bg);border-color:var(--green-m);color:var(--green-t)}
.q-opt.wrong{background:var(--red-bg);border-color:var(--red-m);color:var(--red-t)}
.q-exp{font-size:13px;color:var(--blue-dark);line-height:1.6;padding:10px 14px;background:var(--blue-50);border-radius:var(--r);margin-bottom:.875rem;border-left:3px solid var(--blue)}
.qdot{width:10px;height:10px;border-radius:50%;background:var(--blue-100);display:inline-block}
.qdot.ok{background:var(--green-m)}.qdot.bad{background:var(--red-m)}

/* KONTROLNÍ OTÁZKY ZA KAPITOLOU */
.chk{margin-top:1.5rem;border-top:1px solid var(--border);padding-top:1.25rem}
.chk-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.chk-title{font-size:12px;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.chk-score{font-size:12px;font-weight:600;color:var(--sec)}
.chk-q{border:1px solid var(--border);border-radius:var(--rl);padding:.875rem 1rem;margin-bottom:.75rem;background:#fff}
.chk-q.solved{background:var(--blue-50)}
.chk-qt{font-size:13.5px;font-weight:600;line-height:1.5;margin-bottom:.625rem;display:flex;gap:8px}
.chk-qn{color:var(--blue);flex-shrink:0}
.chk-opts{display:flex;flex-direction:column;gap:6px}
.chk-opt{padding:8px 12px;border:1px solid var(--border2);border-radius:var(--r);cursor:pointer;font-size:12.5px;font-family:inherit;background:#fff;color:var(--text);text-align:left;transition:all .1s;line-height:1.45}
.chk-opt:hover:not([disabled]){background:var(--blue-50);border-color:var(--blue-200)}
.chk-opt.correct{background:var(--green-bg);border-color:var(--green-m);color:var(--green-t);font-weight:500}
.chk-opt.wrong{background:var(--red-bg);border-color:var(--red-m);color:var(--red-t)}
.chk-opt[disabled]{cursor:default}
.chk-exp{font-size:12.5px;line-height:1.6;color:var(--blue-dark);padding:9px 12px;background:var(--blue-50);border-left:3px solid var(--blue);border-radius:var(--r);margin-top:.625rem}

/* ER / SCHÉMATA */
.svg-box{border:1px solid var(--border);border-radius:var(--rl);background:#fff;padding:.5rem;margin-bottom:1rem;overflow-x:auto}
.svg-box svg{display:block;margin:0 auto;max-width:100%;height:auto}
.code{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12.5px;line-height:1.7;background:#0f172a;color:#e2e8f0;padding:.875rem 1rem;border-radius:var(--rl);margin-bottom:1rem;overflow-x:auto;white-space:pre}
.code .k{color:#93c5fd}.code .s{color:#86efac}.code .c{color:#94a3b8;font-style:italic}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-bottom:.5rem}
.mini-tbl caption{font-size:11px;font-weight:700;color:var(--blue);text-align:left;padding-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.mini-tbl th{background:var(--blue-100);color:var(--blue-dark);padding:5px 8px;text-align:left;font-weight:600;border:1px solid var(--border2)}
.mini-tbl td{padding:5px 8px;border:1px solid var(--border);color:var(--text)}
.mini-tbl td.bad{background:var(--red-bg);color:var(--red-t)}
.mini-tbl td.good{background:var(--green-bg);color:var(--green-t)}
.mini-tbl td.key{background:var(--amber-bg);font-weight:600}
.tbl-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:1rem}

/* LESSON NAV */
.lnav{display:flex;justify-content:space-between;align-items:center;padding:.875rem 1.5rem;border-top:1px solid var(--blue-50);background:var(--blue-50)}
.lnav-pos{font-size:12px;color:var(--hint)}

/* COMPLETE */
.complete{text-align:center;padding:2.5rem 1rem}
.complete-star{font-size:56px;margin-bottom:.75rem;line-height:1}
.complete-title{font-size:22px;font-weight:700;margin-bottom:.5rem}
.complete-score{font-size:42px;font-weight:700;color:var(--blue);margin-bottom:.5rem}
.complete-sub{font-size:14px;color:var(--sec);max-width:400px;margin:0 auto 1.5rem;line-height:1.6}
.slabel{font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.5rem}


/* SIMULÁTOR RELAČNÍ ALGEBRY */
.ra-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:7px;margin-bottom:.875rem}
.ra-card{display:flex;align-items:center;gap:9px;padding:9px 11px;border:1px solid var(--border2);background:#fff;
  border-radius:var(--r);cursor:pointer;font-family:inherit;text-align:left;transition:all .13s}
.ra-card:hover{background:var(--blue-50);border-color:var(--blue-200)}
.ra-card.on{background:var(--blue);border-color:var(--blue)}
.ra-op{font-size:16px;font-weight:600;color:var(--blue);min-width:26px;text-align:center;flex-shrink:0}
.ra-op.sm{font-size:11px;letter-spacing:.03em}
.ra-card.on .ra-op{color:#fff}
.ra-nm{font-size:12.5px;color:var(--text);line-height:1.35}
.ra-card.on .ra-nm{color:#fff;font-weight:500}
.ra-query{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:14px;line-height:1.6;
  padding:11px 14px;background:#0f172a;color:#e2e8f0;border-radius:var(--rl);margin-bottom:.75rem;overflow-x:auto}
.ra-lbl{font-size:11px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}

/* PYRAMIDA IS */
.pyr{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:.875rem}
.pyr-lvl{border:1px solid var(--border2);background:#fff;cursor:pointer;font-family:inherit;padding:9px 8px;text-align:center;transition:all .15s;border-radius:4px}
.pyr-lvl:hover{background:var(--blue-50)}
.pyr-lvl.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pyr-nm{font-size:13px;font-weight:700}
.pyr-sub{font-size:10.5px;opacity:.75}
</style>
</head>
<body>
<div class="page">

<div id="toast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:opacity .3s"></div>
<div class="hdr">
  <div class="hdr-icon">
    <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/></svg>
  </div>
  <div style="flex:1">
    <h1>Informační systémy a databáze — interaktivní kurz</h1>
    <p>Od informačního systému přes analýzu a ER model až po normální formy</p>
  </div>
  <button onclick="confirmReset()" title="Resetovat postup" style="background:rgba(255,255,255,.12);border:none;border-radius:8px;padding:7px 10px;cursor:pointer;color:#fff;font-size:11px;font-weight:500;font-family:inherit;white-space:nowrap;flex-shrink:0" onmouseover="this.style.background='rgba(255,255,255,.22)'" onmouseout="this.style.background='rgba(255,255,255,.12)'">↺ Reset</button>
</div>

<div class="prog">
  <div class="prog-top"><span class="prog-lbl">Postup kurzem</span><span class="prog-pct" id="progPct">0 %</span></div>
  <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
  <div class="snav" id="stepsNav"></div>
</div>

<div class="lcard" id="lessonCard"></div>

</div>
<script>

/* ══════════════════════════════════════
   POMOCNÉ
══════════════════════════════════════ */
function hlIcon(t){
  const icons={
    info:`<svg class="hl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
    check:`<svg class="hl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`,
    warn:`<svg class="hl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
    key:`<svg class="hl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="5"/><line x1="12.22" y1="11.22" x2="22" y2="2"/><line x1="22" y1="2" x2="22" y2="7"/><line x1="18" y1="2" x2="18" y2="7"/></svg>`
  };
  return icons[t]||icons.info;
}
function shuffle(arr){
  const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;
}

/* ══════════════════════════════════════
   DEFINICE LEKCÍ
══════════════════════════════════════ */
const LESSONS=[
  {id:'is',     badge:'b-intro', bTxt:'Úvod',          title:'Informační systém',              sub:'Data, informace, prvky a subsystémy IS', nav:'Informační systém'},
  {id:'typy',   badge:'b-prot',  bTxt:'Klasifikace',   title:'Typy IS podle úrovně řízení',    sub:'TPS, MIS, DSS, EIS — pyramida řízení', nav:'Typy IS'},
  {id:'cyklus', badge:'b-sim',   bTxt:'Interaktivní',  title:'Životní cyklus IS',              sub:'Vodopádový model a jeho etapy', nav:'Životní cyklus'},
  {id:'zadani', badge:'b-eth',   bTxt:'Zadání',        title:'Zadání a specifikace požadavků', sub:'Funkční a nefunkční požadavky, formalizace', nav:'Zadání'},
  {id:'er',     badge:'b-sim',   bTxt:'Interaktivní',  title:'Datová analýza — ER model',      sub:'Entity, vztahy, kardinalita, dekompozice', nav:'ER model'},
  {id:'dfd',    badge:'b-deep',  bTxt:'Analýza',       title:'Funkční analýza — DFD',          sub:'Diagram datových toků a jeho úrovně', nav:'DFD'},
  {id:'std',    badge:'b-wifi',  bTxt:'Interaktivní',  title:'Dynamická analýza — STD',        sub:'Stavy, přechody a životní cyklus entity', nav:'STD'},
  {id:'rel',    badge:'b-addr',  bTxt:'Databáze',      title:'Relační model a algebra',        sub:'Převod ER na tabulky, selekce, projekce, spojení', nav:'Relační model'},
  {id:'norm',   badge:'b-sim',   bTxt:'Interaktivní',  title:'Funkční závislosti a normalizace',sub:'Anomálie, 1NF, 2NF, 3NF, BCNF', nav:'Normalizace'},
  {id:'impl',   badge:'b-inet',  bTxt:'Realizace',     title:'Komunikace, implementace, provoz',sub:'Uživatelské rozhraní, testování, údržba', nav:'Implementace'},

const LS_KEY='isdb_kurz_v1';
let memStore=null;
function saveState(){
  const data={curL,done:[...done],qResults,qOrder,chkState};
  memStore=data;
  try{localStorage.setItem(LS_KEY,JSON.stringify(data));}catch(e){}
}
function loadState(){
  let s=null;
  try{const raw=localStorage.getItem(LS_KEY);if(raw)s=JSON.parse(raw);}catch(e){}
  if(!s)s=memStore;
  if(!s)return false;
  curL=s.curL||0;
  (s.done||[]).forEach(i=>done.add(i));
  qResults=s.qResults||[];
  qOrder=s.qOrder||[];
  chkState=s.chkState||{};
  if(qOrder.length===QS.length){
    qShuffledOpts=qOrder.map(qi=>shuffle(QS[qi].opts.map((_,i)=>i)));
  }
  return true;
}
function clearState(){
  memStore=null;
  try{localStorage.removeItem(LS_KEY);}catch(e){}
}

function updateProg(){
  const pct=Math.round(done.size/LESSONS.length*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progPct').textContent=pct+' %';
  document.getElementById('stepsNav').innerHTML=LESSONS.map((l,i)=>{
    const isDone=done.has(i),isActive=i===curL,isLocked=i>0&&!done.has(i-1)&&!isDone&&!isActive;
    const lbl=(isDone?'✓ ':'')+(i+1)+'. '+l.nav;
    return`<button class="sb${isDone?' done':''}${isActive?' active':''}" ${isLocked?'disabled':''} onclick="goL(${i})">${lbl}</button>`;
  }).join('');
}
function goL(i){if(i>0&&!done.has(i-1)&&!done.has(i)&&i!==curL)return;curL=i;saveState();render();updateProg();window.scrollTo({top:0,behavior:'smooth'});}
function completeNext(){done.add(curL);saveState();if(curL<LESSONS.length-1){curL++;render();}else{renderComplete();}updateProg();window.scrollTo({top:0,behavior:'smooth'});}

function render(){
  const l=LESSONS[curL];const isLast=curL===LESSONS.length-1;
  const bMap={is:bIs,typy:bTypy,cyklus:bCyklus,zadani:bZadani,er:bEr,dfd:bDfd,std:bStd,rel:bRel,norm:bNorm,impl:bImpl,quiz:bQuiz};
  let body=(bMap[l.id]||bIs)();
  if(l.id!=='quiz'&&CHECKS[l.id])body+=chkBlock(l.id);
  document.getElementById('lessonCard').innerHTML=
    `<div class="lhead"><div class="lbadge ${l.badge}"><div class="dot"></div>${l.bTxt}</div><div class="ltitle">${l.title}</div><div class="lsub">${l.sub}</div></div>`+
    `<div class="lbody">${body}</div>`+
    `<div class="lnav"><button class="btn btn-g" ${curL===0?'disabled':''} onclick="goL(${curL-1})">← Zpět</button><span class="lnav-pos">${curL+1} / ${LESSONS.length}</span><button class="btn btn-p" id="nextLBtn" onclick="completeNext()">${isLast?'Dokončit kurz ✓':'Další lekce →'}</button></div>`;
  setTimeout(()=>postRender(l.id),40);
}

/* ══════════════════════════════════════
   KONTROLNÍ OTÁZKY ZA KAPITOLOU
══════════════════════════════════════ */
function chkBlock(id){
  const qs=CHECKS[id];
  const st=chkState[id]||{};
  const answered=Object.keys(st).length;
  const okCount=qs.filter((q,i)=>st[i]===q.ans).length;
  return`<div class="chk">
    <div class="chk-hd">
      <span class="chk-title">Kontrolní otázky</span>
      <span class="chk-score" id="chkScore-${id}">${answered?okCount+' / '+qs.length+' správně':qs.length+' otázek'}</span>
    </div>
    ${qs.map((q,i)=>chkQ(id,q,i,st[i])).join('')}
  </div>`;
}
function chkQ(id,q,i,chosen){
  const solved=chosen!==undefined;
  return`<div class="chk-q${solved?' solved':''}" id="chkq-${id}-${i}">
    <div class="chk-qt"><span class="chk-qn">${i+1}.</span><span>${q.q}</span></div>
    <div class="chk-opts">
      ${q.opts.map((o,j)=>{
        let cls='chk-opt';
        if(solved){ if(j===q.ans)cls+=' correct'; else if(j===chosen)cls+=' wrong'; }
        return`<button class="${cls}" ${solved?'disabled':''} onclick="chkAns('${id}',${i},${j})">${o}</button>`;
      }).join('')}
    </div>
    ${solved?`<div class="chk-exp">${q.exp}</div>`:''}
  </div>`;
}
function chkAns(id,i,j){
  if(!chkState[id])chkState[id]={};
  if(chkState[id][i]!==undefined)return;
  chkState[id][i]=j;
  saveState();
  const q=CHECKS[id][i];
  document.getElementById('chkq-'+id+'-'+i).outerHTML=chkQ(id,q,i,j);
  const qs=CHECKS[id],st=chkState[id];
  const okCount=qs.filter((qq,k)=>st[k]===qq.ans).length;
  const el=document.getElementById('chkScore-'+id);
  if(el)el.textContent=okCount+' / '+qs.length+' správně';
}

/* ══════════════════════════════════════

══════════════════════════════════════ */
const C={blue:'#1a56db',blueD:'#1e40af',blue50:'#eff6ff',blue100:'#dbeafe',blue200:'#bfdbfe',
  text:'#111827',sec:'#6b7280',hint:'#9ca3af',border:'#dbeafe',
  green:'#16a34a',greenBg:'#f0fdf4',red:'#dc2626',redBg:'#fef2f2',amber:'#d97706',white:'#fff'};

function ctxOf(id){const c=document.getElementById(id);if(!c)return null;const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);return x;}
function rrect(x,rx,ry,w,h,r){x.beginPath();x.moveTo(rx+r,ry);x.arcTo(rx+w,ry,rx+w,ry+h,r);x.arcTo(rx+w,ry+h,rx,ry+h,r);x.arcTo(rx,ry+h,rx,ry,r);x.arcTo(rx,ry,rx+w,ry,r);x.closePath();}
function arrow(x,x1,y1,x2,y2,col,w){
  x.strokeStyle=col;x.fillStyle=col;x.lineWidth=w||1.5;
  x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();
  const a=Math.atan2(y2-y1,x2-x1),h=7;
  x.beginPath();x.moveTo(x2,y2);
  x.lineTo(x2-h*Math.cos(a-0.4),y2-h*Math.sin(a-0.4));
  x.lineTo(x2-h*Math.cos(a+0.4),y2-h*Math.sin(a+0.4));
  x.closePath();x.fill();
}
function label(x,t,px,py,col,size,align,bold){
  x.fillStyle=col||C.text;x.font=(bold?'600 ':'')+(size||11)+'px Inter,sans-serif';
  x.textAlign=align||'center';x.textBaseline='middle';x.fillText(t,px,py);
}
/* přepočet kliknutí na souřadnice canvasu */
function canvasXY(canvas,ev){
  const r=canvas.getBoundingClientRect();
  return{x:(ev.clientX-r.left)*(canvas.width/r.width),y:(ev.clientY-r.top)*(canvas.height/r.height)};
}

function postRenderCyklus(){
  const c=document.getElementById('cyklC');if(!c)return;
  c.onclick=e=>{
    const p=canvasXY(c,e);
    for(let i=0;i<FAZE.length;i++){
      const b=fazeBox(i);
      if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){fazeSel=i;drawCyklus();renderFaze();return;}
    }
  };
  drawCyklus();renderFaze();
}
function fazeBox(i){return{x:18+i*58,y:18+i*42,w:178,h:32};}
function drawCyklus(){
  const x=ctxOf('cyklC');if(!x)return;
  x.fillStyle=C.blue50;x.fillRect(0,0,600,330);
  // spojnice kaskády
  for(let i=0;i<FAZE.length-1;i++){
    const a=fazeBox(i),b=fazeBox(i+1);
    x.strokeStyle=C.blue200;x.lineWidth=1.5;
    x.beginPath();x.moveTo(a.x+34,a.y+a.h);x.lineTo(a.x+34,b.y+b.h/2);x.lineTo(b.x,b.y+b.h/2);x.stroke();
    arrow(x,b.x-9,b.y+b.h/2,b.x-1,b.y+b.h/2,C.blue200,1.5);
  }
  // zpětné šipky
  for(let i=1;i<FAZE.length;i++){
    const a=fazeBox(i-1),b=fazeBox(i);
    x.strokeStyle='#c7d7f5';x.lineWidth=1;x.setLineDash([3,3]);
    x.beginPath();x.moveTo(b.x+b.w-14,b.y);x.lineTo(b.x+b.w-14,a.y+a.h/2);x.lineTo(a.x+a.w,a.y+a.h/2);x.stroke();
    x.setLineDash([]);
  }
  FAZE.forEach((f,i)=>{
    const b=fazeBox(i),on=i===fazeSel;
    x.fillStyle=on?C.blue:C.white;x.strokeStyle=on?C.blue:C.blue200;x.lineWidth=on?2:1.2;
    rrect(x,b.x,b.y,b.w,b.h,6);x.fill();x.stroke();
    label(x,(i+1)+'. '+f.nm,b.x+b.w/2,b.y+b.h/2,on?'#fff':C.text,12.5,'center',true);
  });
  label(x,'vodopádový model',592,14,C.hint,10.5,'right',true);
}
function renderFaze(){
  const f=FAZE[fazeSel];
  const el=document.getElementById('fazeDetail');if(!el)return;
  el.innerHTML=`
    <div class="expl-card">
      <div class="expl-num">Etapa ${fazeSel+1} z ${FAZE.length} · odpovídá: ${f.kdo}</div>
      <div class="expl-title">${f.nm}</div>

/* ══════════════════════════════════════
   GEOMETRIE — spojnice mezi okraji tvarů
══════════════════════════════════════ */
/* tvar: {k:'rect',x,y,w,h} | {k:'ell',x,y,rx,ry} | {k:'mem',x,y,w} */
function edgePoint(s,tx,ty){
  const dx=tx-s.x, dy=ty-s.y, len=Math.hypot(dx,dy)||1;
  const ux=dx/len, uy=dy/len;
  if(s.k==='ell'){
    const t=1/Math.sqrt((ux*ux)/(s.rx*s.rx)+(uy*uy)/(s.ry*s.ry));
    return{x:s.x+ux*t,y:s.y+uy*t};
  }
  const hw=(s.k==='mem'?s.w/2:s.w/2), hh=(s.k==='mem'?11:s.h/2);
  const tX=Math.abs(ux)<1e-6?1e9:hw/Math.abs(ux);
  const tY=Math.abs(uy)<1e-6?1e9:hh/Math.abs(uy);
  const t=Math.min(tX,tY);
  return{x:s.x+ux*t,y:s.y+uy*t};
}
/* spojí dva tvary šipkou; off = kolmé odsazení (pro obousměrné dvojice) */
function connect(x,a,b,col,off,gap){
  off=off||0;gap=gap==null?4:gap;
  const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
  const nx=-dy/len,ny=dx/len;
  const A={...a,x:a.x+nx*off,y:a.y+ny*off};
  const B={...b,x:b.x+nx*off,y:b.y+ny*off};
  const p1=edgePoint(A,B.x,B.y), p2=edgePoint(B,A.x,A.y);
  const ux=(p2.x-p1.x)/(Math.hypot(p2.x-p1.x,p2.y-p1.y)||1);
  const uy=(p2.y-p1.y)/(Math.hypot(p2.x-p1.x,p2.y-p1.y)||1);
  arrow(x,p1.x+ux*gap,p1.y+uy*gap,p2.x-ux*gap,p2.y-uy*gap,col||C.text,1.3);
  return{mx:(p1.x+p2.x)/2,my:(p1.y+p2.y)/2};
}

function entBox(x,cx,cy,w,h,txt,hi){
  x.fillStyle=hi?C.greenBg:C.white;x.strokeStyle=hi?C.green:C.text;x.lineWidth=hi?2.2:1.7;
  x.fillRect(cx-w/2,cy-h/2,w,h);x.strokeRect(cx-w/2,cy-h/2,w,h);
  label(x,txt,cx,cy,hi?'#14532d':C.text,12.5,'center');
}
function relDia(x,cx,cy,hw,txt){
  x.beginPath();x.moveTo(cx-hw,cy);x.lineTo(cx,cy-26);x.lineTo(cx+hw,cy);x.lineTo(cx,cy+26);x.closePath();
  x.fillStyle=C.white;x.fill();x.strokeStyle=C.text;x.lineWidth=1.7;x.stroke();
  label(x,txt,cx,cy,C.text,11,'center');
}
/* Značky u entity: husí nožka přiléhá k entitě, za ní kroužek.
   Vrací X, kde má začít souvislá čára ke vztahu. */
function erMarks(x,edgeX,y,dir,many,pov){
  x.strokeStyle=C.text;x.lineWidth=1.7;x.fillStyle=C.text;
  let p=edgeX;
  if(many){
    const tip=edgeX+dir*15;
    x.beginPath();
    x.moveTo(tip,y);x.lineTo(edgeX,y-10);
    x.moveTo(tip,y);x.lineTo(edgeX,y);
    x.moveTo(tip,y);x.lineTo(edgeX,y+10);
    x.stroke();
    p=tip;
  }
  const cx=p+dir*7;
  x.beginPath();x.arc(cx,y,6.5,0,Math.PI*2);
  if(pov){x.fillStyle=C.text;x.fill();}else{x.fillStyle=C.white;x.fill();x.stroke();}
  return cx+dir*6.5;
}
function drawEr(){
  const x=ctxOf('erC');if(!x)return;
  x.fillStyle=C.blue50;x.fillRect(0,0,600,200);
  const k=KARD.find(v=>v.id===kardSel);
  const y=112;

  if(kardSel==='mn'&&dekompOn){
    label(x,'Po dekompozici — vztah M:N nahrazen dvěma vztahy 1:N',300,26,C.green,11.5,'center',true);
    const EW=92,EH=36;
    entBox(x,58,y,EW,EH,'Učitel');
    entBox(x,300,y,EW,EH,'Výuka',true);
    entBox(x,542,y,EW,EH,'Předmět');
    relDia(x,179,y,36,'UČÍ');
    relDia(x,421,y,40,'SE TÝKÁ');
    // Učitel —(1,povinné)— UČÍ —(N,povinné)— Výuka
    let s=erMarks(x,58+EW/2,y,1,false,true);

  start:{x:40,y:56}, obj:{x:158,y:56}, skl:{x:330,y:56},

function postRenderStd(){stdRender();}
function stdAvail(){return PRECH.filter(p=>p.f===stdCur);}

  const btns=document.getElementById('stdBtns');if(!btns)return;

  lg.scrollTop=lg.scrollHeight;

function stdFire(idx){
  const p=PRECH[idx];
  if(p.f!==stdCur)return;
  stdLog.push({t:'► '+p.ev+(p.ac!=='—'?'  →  '+p.ac:''),c:p.t==='vyr'||p.t==='end'?'err':'ok'});
  stdCur=p.t;
  if(stdLog.length>20)stdLog.shift();
  stdRender();
}
function stdReset(){stdCur='start';stdLog=[];stdRender();}
function drawStd(){
  const x=ctxOf('stdC');if(!x)return;
  x.fillStyle=C.blue50;x.fillRect(0,0,600,310);
  const SW=100,SH=36;
  const shape=id=>{
    const p=STD_POS[id];
    if(id==='start'||id==='end')return{k:'ell',x:p.x,y:p.y,rx:11,ry:11};
    return{k:'rect',x:p.x,y:p.y,w:SW,h:SH};
  };
  const av=stdAvail().map(p=>p.f+'>'+p.t);
  /* dvojice v obou směrech dostanou kolmý odstup */
  const pary={};
  PRECH.forEach(p=>{const k=[p.f,p.t].sort().join('|');pary[k]=(pary[k]||0)+1;});

  const popisky=[];
  PRECH.forEach(p=>{
    const on=av.includes(p.f+'>'+p.t);
    const key=[p.f,p.t].sort().join('|');
    let off=0;
    if(pary[key]>1)off=(p.f<p.t?9:-9);
    const m=connect(x,shape(p.f),shape(p.t),on?C.blue:'#d5e2f6',off,3);
    if(on)popisky.push({p,m});
  });
  /* popisky až po všech šipkách, aby je nic nepřekrylo */
  popisky.forEach(({p,m})=>{
    const a=STD_POS[p.f],b=STD_POS[p.t];
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len;
    const px=m.mx+nx*14,py=m.my+ny*14;
    x.font='600 9.5px Inter,sans-serif';
    const w=x.measureText(p.ev).width;
    x.fillStyle='#eff6ff';
    rrect(x,px-w/2-5,py-8,w+10,16,4);x.fill();
    x.strokeStyle=C.blue200;x.lineWidth=1;x.stroke();
    label(x,p.ev,px,py,C.blue,9.5,'center',true);
  });
  /* počáteční a koncový uzel */
  const s0=STD_POS.start,s1=STD_POS.end;
  x.fillStyle=stdCur==='start'?C.green:C.text;
  x.beginPath();x.arc(s0.x,s0.y,9,0,Math.PI*2);x.fill();
  x.strokeStyle=stdCur==='end'?C.green:C.text;x.lineWidth=2;
  x.beginPath();x.arc(s1.x,s1.y,11,0,Math.PI*2);x.stroke();
  x.fillStyle=stdCur==='end'?C.green:C.text;
  x.beginPath();x.arc(s1.x,s1.y,5.5,0,Math.PI*2);x.fill();

  STAVY.forEach(s=>{
    const p=STD_POS[s.id],on=s.id===stdCur;
    x.fillStyle=on?C.greenBg:C.white;x.strokeStyle=on?C.green:C.text;x.lineWidth=on?2.4:1.4;
    rrect(x,p.x-SW/2,p.y-SH/2,SW,SH,5);x.fill();x.stroke();
    label(x,s.nm,p.x,p.y,on?'#14532d':C.text,11.5,'center',on);
  });
}

const DB={

/* ── vyhodnocení ─────────────────────────────── */
function raEval(q){
  q=(q||'').trim();
  if(!q)throw new Error('zadej dotaz, například σ rocnik=1 (Student)');
  if(/^select/i.test(q))return raSql(q);
  return raAlg(q);
}
function raRel(name){
  const key=Object.keys(DB).find(k=>k.toLowerCase()===name.trim().toLowerCase());
  if(!key)throw new Error('relace „'+name.trim()+'“ neexistuje. K dispozici je Student a Zapis.');
  return{cols:[...DB[key].cols],rows:DB[key].rows.map(r=>[...r]),note:'Relace '+key};
}
/* najde odpovídající uzavírací závorku */
function matchPar(s,i){
  let d=0;
  for(let k=i;k<s.length;k++){
    if(s[k]==='(')d++;
    else if(s[k]===')'){d--;if(d===0)return k;}
  }
  throw new Error('chybí uzavírací závorka');
}
function raAlg(q){
  q=q.trim();
  /* vnější závorky */
  if(q[0]==='('&&matchPar(q,0)===q.length-1)return raAlg(q.slice(1,-1));
  /* binární operace na nejvyšší úrovni */
  let d=0;
  for(let i=0;i<q.length;i++){
    if(q[i]==='(')d++;else if(q[i]===')')d--;
    else if(d===0&&'⋈∪∩−-'.includes(q[i])){
      const op=q[i],L=raAlg(q.slice(0,i)),R=raAlg(q.slice(i+1));
      if(op==='⋈')return raJoin(L,R);
      return raSet2(L,R,op);
    }
  }
  /* unární σ / π */
  if(q[0]==='σ'||q[0]==='π'){
    const op=q[0];
    const pi=q.indexOf('(');
    if(pi<0)throw new Error('u operace '+op+' chybí závorka s relací');
    const arg=q.slice(1,pi).trim();
    const inner=raAlg(q.slice(pi+1,matchPar(q,pi)));
    return op==='σ'?raSel(inner,arg):raProj(inner,arg);
  }
  return raRel(q);
}
function raSel(rel,cond){
  const m=cond.match(/^\s*(\w+)\s*(>=|<=|<>|!=|=|>|<)\s*(.+?)\s*$/);
  if(!m)throw new Error('podmínku „'+cond+'“ neumím přečíst. Použij tvar atribut=hodnota.');
  const [,at,op,valRaw]=m;
  const ci=rel.cols.findIndex(c=>c.toLowerCase()===at.toLowerCase());
  if(ci<0)throw new Error('atribut „'+at+'“ v relaci není. Dostupné: '+rel.cols.join(', '));
  const val=valRaw.replace(/^['"]|['"]$/g,'');
  const num=v=>isNaN(parseFloat(v))?null:parseFloat(v);
  const rows=rel.rows.filter(r=>{
    const a=r[ci],na=num(a),nb=num(val);
    const both=na!==null&&nb!==null;
    switch(op){
      case '=':return both?na===nb:a.toLowerCase()===val.toLowerCase();
      case '>':return both?na>nb:a>val;
      case '<':return both?na<nb:a<val;
      case '>=':return both?na>=nb:a>=val;
      case '<=':return both?na<=nb:a<=val;
      default:return both?na!==nb:a.toLowerCase()!==val.toLowerCase();
    }
  });
  return{cols:rel.cols,rows,
    note:'<strong>Selekce σ</strong> vybrala řádky splňující <em>'+at+' '+op+' '+val+'</em>. Počet sloupců se nezměnil ('+rel.cols.length+'), z '+rel.rows.length+' řádků zbylo '+rows.length+'.'};
}
function raProj(rel,list){
  const want=list.split(',').map(s=>s.trim()).filter(Boolean);
  if(!want.length)throw new Error('u projekce chybí seznam atributů');
  const idx=want.map(w=>{
    const i=rel.cols.findIndex(c=>c.toLowerCase()===w.toLowerCase());
    if(i<0)throw new Error('atribut „'+w+'“ v relaci není. Dostupné: '+rel.cols.join(', '));
    return i;
  });
  const seen=new Set(),rows=[];
  rel.rows.forEach(r=>{
    const nr=idx.map(i=>r[i]),k=nr.join('\u0001');
    if(!seen.has(k)){seen.add(k);rows.push(nr);}
  });
  const dup=rel.rows.length-rows.length;
  return{cols:idx.map(i=>rel.cols[i]),rows,
    note:'<strong>Projekce π</strong> ponechala sloupce <em>'+want.join(', ')+'</em>. '+
         (dup>0?'Vzniklo '+dup+' duplicitních řádků — relace je množina, proto byly odstraněny.':'Žádné duplicity nevznikly.')};
}
function raJoin(a,b){
  const common=a.cols.filter(c=>b.cols.includes(c));
  if(!common.length)throw new Error('relace nemají společný atribut, spojení nelze provést');
  const ai=common.map(c=>a.cols.indexOf(c)),bi=common.map(c=>b.cols.indexOf(c));
  const restB=b.cols.map((c,i)=>i).filter(i=>!bi.includes(i));
  const cols=[...a.cols,...restB.map(i=>b.cols[i])];
  const rows=[];
  a.rows.forEach(ra=>b.rows.forEach(rb=>{
    if(ai.every((x,k)=>ra[x]===rb[bi[k]]))rows.push([...ra,...restB.map(i=>rb[i])]);
  }));
  const lost=a.rows.filter(ra=>!b.rows.some(rb=>ai.every((x,k)=>ra[x]===rb[bi[k]]))).length;
  return{cols,rows,
    note:'<strong>Spojení ⋈</strong> proběhlo přes společný atribut <em>'+common.join(', ')+'</em>. '+
         (lost>0?'Pozor: '+lost+' záznam(ů) levé relace nemá protějšek, a proto ve výsledku chybí — zachovalo by je až vnější spojení.':'Všechny záznamy našly protějšek.')};
}
function raSet2(a,b,op){
  if(a.cols.length!==b.cols.length||!a.cols.every((c,i)=>c===b.cols[i]))
    throw new Error('množinové operace vyžadují kompatibilní relace se stejnými atributy');
  const key=r=>r.join('\u0001');
  const bs=new Set(b.rows.map(key));
  const as=new Set(a.rows.map(key));
  let rows,nm;
  if(op==='∪'){
    rows=[...a.rows];b.rows.forEach(r=>{if(!as.has(key(r)))rows.push(r);});
    nm='<strong>Sjednocení ∪</strong> — všechny záznamy z obou relací, duplicity jen jednou.';
  }else if(op==='∩'){
    rows=a.rows.filter(r=>bs.has(key(r)));
    nm='<strong>Průnik ∩</strong> — pouze záznamy, které jsou v obou relacích.';
  }else{
    rows=a.rows.filter(r=>!bs.has(key(r)));
    nm='<strong>Rozdíl −</strong> — záznamy z první relace, které nejsou ve druhé.';
  }
  return{cols:a.cols,rows,note:nm};
}
function raSql(q){
  const m=q.match(/^\s*select\s+(.+?)\s+from\s+(\w+)(?:\s+where\s+(.+?))?\s*;?\s*$/i);
  if(!m)throw new Error('očekávám tvar SELECT sloupce FROM tabulka [WHERE podmínka]');
  let rel=raRel(m[2]);
  if(m[3])rel=raSel(rel,m[3]);
  if(m[1].trim()!=='*')rel=raProj(rel,m[1]);
  rel.note='<strong>SQL dotaz</strong> se vyhodnotil jako '+(m[3]?'selekce σ a poté ':'')+'projekce π — právě takto jej rozloží i databázový optimalizátor.';
  return rel;
}

     exp:'Řešením je rozdělení: krátká transakce načte data do pomocných polí, uživatel pracuje mimo transakci a druhá krátká transakce výsledek zapíše.'},
    {q:'Které chybové hlášení odpovídá principu vlídnosti?',
     opts:['„ERROR 0x8004005“','„Neplatný vstup!“','„Do pole Ročník zadejte prosím číslo od 1 do 5.“','„Chyba. Kontaktujte správce.“'],ans:2,
     exp:'Hlášení má být srozumitelné, konkrétní, v kontextu a má uživateli říct, co udělat dál. Kód chyby ani obecné „neplatný vstup“ mu nepomohou.'},
    {q:'Která kategorie údržby reaguje na nové požadavky uživatele?',
     opts:['Opravárenská','Adaptivní','Preventivní','Zdokonalovací'],ans:3,
     exp:'Opravárenská odstraňuje chyby, adaptivní reaguje na změny prostředí, preventivní zlepšuje udržovatelnost a zdokonalovací řeší nové či změněné požadavky.'},
  ],
};

/* ══════════════════════════════════════
   ZÁVĚREČNÝ KVÍZ
══════════════════════════════════════ */
const QS=[
  {q:'Co je výsledkem datové analýzy?',opts:['Diagram datových toků','Konceptuální schéma','Minispecifikace funkcí','Systémový návrh'],ans:1,
   exp:'Konceptuální schéma zpřesňuje zadání tak, aby bylo úplné, jednoznačné, přesné a bezesporné. Obsahuje ER diagram, seznam entit a vztahů, datový slovník a integritní omezení.'},
  {q:'Ve kterém pořadí jdou etapy vodopádového modelu?',opts:['Analýza → zadání → návrh → implementace','Zadání → analýza → návrh implementace → implementace → testování → předání → provoz','Zadání → implementace → analýza → testování','Návrh → zadání → analýza → provoz'],ans:1,
   exp:'Každá etapa musí být dokončena, než začne následující, a její výstup je vstupem té další. Zpětné šipky znamenají návrat při zjištění chyby — čím delší, tím dražší.'},
  {q:'Který požadavek je funkční?',opts:['Systém musí být dostupný 24/7','Systém umožní vyhledat studenta podle příjmení','Odezva nesmí překročit 2 sekundy','Systém musí běžet na Windows i Linuxu'],ans:1,
   exp:'Funkční požadavek říká, co systém dělá. Dostupnost, odezva a přenositelnost jsou požadavky nefunkční — popisují kvalitu a podmínky fungování.'},
  {q:'Co znamená prázdný kroužek na konci spojnice v ER diagramu?',opts:['Povinné členství ve vztahu','Nepovinné členství ve vztahu','Kardinalitu M:N','Cizí klíč'],ans:1,
   exp:'Prázdný kroužek = nepovinné členství, plný = povinné. Počet entit ve vztahu vyjadřuje samostatně „husí nožka“.'},
  {q:'Kolik vztahů vznikne dekompozicí jednoho vztahu M:N?',opts:['Jeden vztah 1:1','Dva vztahy 1:N','Tři vztahy 1:1','Žádný, vztah zanikne'],ans:1,
   exp:'Mezi oba entitní typy se vloží nový entitní typ a původní vztah M:N se nahradí dvěma vztahy 1:N směřujícími do něj.'},
  {q:'Který prvek DFD odpovídá tabulce v budoucí databázi?',opts:['Proces','Datový tok','Datová paměť','Aktér'],ans:2,
   exp:'Datové paměti v DFD jsou entitní typy z konceptuálního schématu. Datová a funkční analýza popisují tentýž systém z různých úhlů.'},
  {q:'Co popisuje minispecifikace?',opts:['Vztahy mezi entitami','Algoritmus elementární funkce nejnižší úrovně DFD','Stavy, ve kterých se entita může nacházet','Rozpočet projektu'],ans:1,
   exp:'Rozkladem DFD se dostaneme k funkcím, které už nemá smysl dělit. Minispecifikace popisuje, co se uvnitř takové funkce odehrává — včetně kontrol vstupů.'},
  {q:'Který stavový prvek se provede před každým opuštěním stavu?',opts:['Entry','Exit','Do','Trigger'],ans:1,
   exp:'Exit se provede před každým opuštěním stavu, entry po každém vstupu do něj a „do“ je aktivita trvání stavu.'},
  {q:'Která operace relační algebry vybírá sloupce?',opts:['Selekce (σ)','Projekce (π)','Spojení (⋈)','Rozdíl (−)'],ans:1,
   exp:'Projekce vybírá sloupce a odstraňuje duplicitní řádky. Selekce naopak vybírá řádky splňující podmínku.'},
  {q:'Schéma je v 1NF a každý neklíčový atribut závisí na celém klíči. V jaké je normální formě?',opts:['Zůstává v 1NF','2NF','3NF','BCNF'],ans:1,
   exp:'To je přesně definice 2NF. Pro 3NF by navíc nesměla existovat tranzitivní závislost neklíčových atributů na klíči.'},
  {q:'Co říká Armstrongův axiom tranzitivity?',opts:['Je-li B podmnožinou A, pak A → B','Platí-li A → B, pak AC → BC','Platí-li A → B a B → C, pak A → C','Každý determinant je kandidátním klíčem'],ans:2,
   exp:'Tranzitivita umožňuje řetězit závislosti. První možnost je reflexivita, druhá rozšíření. Poslední tvrzení je definice BCNF, nikoli axiom.'},
  {q:'Která kategorie údržby reaguje na přechod na nový operační systém?',opts:['Opravárenská','Adaptivní','Preventivní','Zdokonalovací'],ans:1,
   exp:'Adaptivní údržba přizpůsobuje systém změnám prostředí — novému hardwaru nebo nové verzi operačního systému. Není to oprava chyby.'},
];

let qI=0,qDone=false;
let qShuffledOpts=[];

function initQuizOrder(){
  qOrder=shuffle(QS.map((_,i)=>i));
  qShuffledOpts=qOrder.map(qi=>shuffle(QS[qi].opts.map((_,i)=>i)));
  saveState();
}
function curQ(){return QS[qOrder[qI]];}
function curOpts(){const q=curQ(),idxs=qShuffledOpts[qI];return idxs.map(i=>q.opts[i]);}
function curCorrectNew(){const q=curQ(),idxs=qShuffledOpts[qI];return idxs.indexOf(q.ans);}

function bQuiz(){return`<div class="txt"><p>Závěrečný kvíz prověří látku ze všech deseti kapitol. Otázky i odpovědi se míchají, takže si test můžeš zopakovat vícekrát.</p></div><div id="qBox"></div>`;}
function postRenderQuiz(){
  qI=0;qDone=false;qResults=[];
  if(qOrder.length!==QS.length)initQuizOrder();
  renderQ();
}
function renderQ(){
  const box=document.getElementById('qBox');if(!box)return;
  if(qI>=QS.length){renderQuizResults(box);return;}
  const q=curQ(),opts=curOpts(),pct=Math.round(qI/QS.length*100);
  box.innerHTML=`
    <div class="q-prog-wrap"><div class="q-prog" style="width:${pct}%"></div></div>
    <div class="q-meta">Otázka ${qI+1} z ${QS.length}</div>
    <div class="q-text">${q.q}</div>
    <div class="q-opts">${opts.map((o,i)=>`<button class="q-opt" id="qo${i}" onclick="qAns(${i})">${o}</button>`).join('')}</div>
    <div id="qExp" class="q-exp" style="display:none"></div>
    <button id="qNxt" class="btn btn-p" style="display:none" onclick="qI++;qDone=false;renderQ()">${qI===QS.length-1?'Zobrazit výsledek →':'Další otázka →'}</button>`;
}
function qAns(i){
  if(qDone)return;qDone=true;
  const correct=curCorrectNew();
  qResults.push(i===correct);
  for(let j=0;j<curOpts().length;j++){
    const b=document.getElementById('qo'+j);b.disabled=true;
    if(j===correct)b.classList.add('correct');
    else if(j===i)b.classList.add('wrong');
  }
  document.getElementById('qExp').style.display='block';
  document.getElementById('qExp').textContent=curQ().exp;
  document.getElementById('qNxt').style.display='inline-block';
  saveState();
}
function renderQuizResults(box){
  saveState();
  const sc=qResults.filter(r=>r).length;
  const wrongItems=qResults.map((r,i)=>r?null:qOrder[i]).filter(v=>v!==null);
  const grade=sc===QS.length?'Výborně! Perfektní skóre.':sc>=10?'Skvělá práce — drobné mezery.':sc>=7?'Dobrý základ. Projdi si chybné odpovědi níže.':'Doporučuji projít kurz znovu.';
  const wrongHTML=wrongItems.length===0?'':`
    <div style="text-align:left;margin-top:1.25rem">
      <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--sec);margin-bottom:.75rem">Chybné odpovědi — správná řešení</div>
      ${wrongItems.map(qi=>{
        const q=QS[qi];
        return`<div style="background:var(--red-bg);border:1px solid var(--red-b);border-radius:var(--r);padding:.75rem 1rem;margin-bottom:.5rem">
          <div style="font-size:13px;font-weight:600;color:var(--red-t);margin-bottom:4px">${q.q}</div>
          <div style="font-size:12px;color:var(--green-m)">✓ ${q.opts[q.ans]}</div>
          <div style="font-size:12px;color:var(--sec);margin-top:4px;line-height:1.5">${q.exp}</div>
        </div>`;}).join('')}
    </div>`;
  box.innerHTML=`<div class="complete">
    <div class="complete-star">★</div>
    <div class="complete-score">${sc} / ${QS.length}</div>
    <div style="display:flex;gap:4px;justify-content:center;margin-bottom:.75rem;flex-wrap:wrap">
      ${qResults.map((r,i)=>`<span class="qdot ${r?'ok':'bad'}" title="${QS[qOrder[i]].q.slice(0,40)}…"></span>`).join('')}
    </div>
    <div class="complete-sub">${grade}</div>
    <button class="btn btn-p" onclick="qI=0;qDone=false;qResults=[];initQuizOrder();renderQ()">Zkusit znovu (nové pořadí)</button>
    ${wrongHTML}
  </div>`;
}

/* ══════════════════════════════════════
   DOKONČENÍ A SLUŽBY
══════════════════════════════════════ */
function renderComplete(){
  const sc=qResults.filter(r=>r).length;
  let chkOk=0,chkTotal=0;
  Object.keys(CHECKS).forEach(k=>{
    chkTotal+=CHECKS[k].length;
    const st=chkState[k]||{};
    CHECKS[k].forEach((q,i)=>{if(st[i]===q.ans)chkOk++;});
  });
  document.getElementById('lessonCard').innerHTML=`
    <div class="lbody">
      <div class="complete">
        <div class="complete-star">★</div>
        <div class="complete-title">Kurz dokončen!</div>
        <div class="complete-score">${sc} / ${QS.length}</div>
        <div class="complete-sub">
          V závěrečném kvízu jsi získal ${sc} z ${QS.length} bodů.<br>
          V kontrolních otázkách ${chkOk} z ${chkTotal} správně.<br><br>
          Prošel jsi celou cestu od pojmu informačního systému přes zadání, datovou, funkční
          i dynamickou analýzu až po relační model, normalizaci a provoz. Gratuluji!
        </div>
        <button class="btn btn-p" onclick="restart()">Začít kurz znovu</button>
      </div>
    </div>`;
}
function showToast(msg,ms=2800){
  const t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.style.display='block';t.style.opacity='1';
  clearTimeout(t._to);
  t._to=setTimeout(()=>{t.style.opacity='0';setTimeout(()=>{t.style.display='none';},300);},ms);
}
function confirmReset(){
  if(done.size===0&&curL===0&&Object.keys(chkState).length===0){showToast('Žádný postup k resetování.');return;}
  if(confirm('Opravdu resetovat celý postup? Tuto akci nelze vrátit zpět.')){
    restart();showToast('Postup byl resetován.');
  }
}
function restart(){
  curL=0;done.clear();qResults=[];qI=0;qOrder=[];chkState={};
  fazeSel=0;ot7Sel=0;kardSel='11';dekompOn=false;dfdSel=1;operSel='sel';nfKrok=0;chybSel=0;pyrSel='tps';
  stdCur='start';stdLog=[];
  clearState();render();updateProg();window.scrollTo({top:0,behavior:'smooth'});
}

/* INIT */
loadState();
updateProg();
render();
if(done.size>0)showToast('Vítej zpět! Postup byl obnoven ('+done.size+'/'+LESSONS.length+' lekcí).');

</script>
